      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="55%" stop-color="#2f2570"/>
      <stop offset="100%" stop-color="#5a45c9"/>
    </linearGradient>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
